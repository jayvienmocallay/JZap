# =============================================================================
# JZap Redis Configuration
# Redis 7.x — optimized for ephemeral rate limiting state
# =============================================================================

# --- NETWORK ---

# Bind to all interfaces. In production, Redis runs inside a Docker network
# and is not exposed to the public internet. Access is restricted via the
# Docker network and the requirepass directive.
bind 0.0.0.0

# Protected mode prevents Redis from accepting connections from external hosts
# when no password is set. Even with bind 0.0.0.0, this adds a safety check.
protected-mode yes

# Standard Redis port.
port 6379

# TCP keepalive: send keepalive probes every 300 seconds.
# Detects dead connections in Docker environments where network partitions
# can leave stale connections open.
tcp-keepalive 300

# Client idle timeout: 0 = never disconnect idle clients.
# Rate limiting clients (proxy nodes, agents) maintain persistent connections,
# so we don't want to time them out.
timeout 0

# --- MEMORY ---

# Maximum memory: 256 MB.
# Rate limit counters, sliding window state, and temporary blocklists are
# small per key but can accumulate during attacks. 256 MB provides sufficient
# headroom for sustained high-traffic scenarios.
maxmemory 256mb

# Eviction policy: allkeys-lru (Least Recently Used).
# Rate limit counters are ephemeral — if memory is full, evicting the least
# recently used keys is safe because:
#   - Expired counters are stale anyway
#   - Active counters will be recreated on the next request
#   - This prevents OOM crashes during volumetric attacks
maxmemory-policy allkeys-lru

# --- PERSISTENCE ---

# Disable RDB snapshots. Rate limit state is ephemeral and reconstructed
# naturally from incoming traffic. Persistence adds unnecessary disk I/O
# and startup time.
save ""

# Disable AOF (Append Only File). Same reasoning as RDB — we do not need
# durability for ephemeral rate limiting counters.
appendonly no

# --- LOGGING ---

# Log level: notice (default). Set to "warning" in production to reduce noise.
loglevel notice

# Log to stdout for Docker container logging.
logfile ""

# --- PERFORMANCE ---

# Number of databases. We only use db 0, but keep a few for potential
# future use (e.g., separate db for blocklist vs. rate limit state).
databases 4

# Disable Lua scripting time limit for atomic rate limiting operations.
# JZap uses Lua scripts for atomic sliding window rate limiting.
# The default 5000ms limit is fine for our use case.
lua-time-limit 5000

# --- SECURITY ---

# Require a password for all connections. Set via environment variable
# in Docker Compose. Uncomment and set in production:
# requirepass ${REDIS_PASSWORD}

# Rename dangerous commands to prevent accidental data loss.
# In production, consider renaming FLUSHALL, FLUSHDB, CONFIG, DEBUG.
# rename-command FLUSHALL ""
# rename-command FLUSHDB ""
# rename-command CONFIG "JZAP_CONFIG"
