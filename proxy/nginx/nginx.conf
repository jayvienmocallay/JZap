# =============================================================================
# JZap (ShieldProxy) — OpenResty Main Configuration
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/openresty/error.log warn;
pid /var/run/openresty.pid;

events {
    worker_connections 16384;
    multi_accept on;
    use epoll;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # Logging
    # -------------------------------------------------------------------------
    log_format jzap_json escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"request_method":"$request_method",'
            '"request_uri":"$request_uri",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_user_agent":"$http_user_agent",'
            '"http_referer":"$http_referer",'
            '"upstream_response_time":"$upstream_response_time",'
            '"ssl_protocol":"$ssl_protocol",'
            '"ssl_cipher":"$ssl_cipher"'
        '}';

    access_log /var/log/openresty/access.log jzap_json;

    # -------------------------------------------------------------------------
    # Performance tuning
    # -------------------------------------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # -------------------------------------------------------------------------
    # Security headers (defaults)
    # -------------------------------------------------------------------------
    server_tokens off;
    more_clear_headers Server;

    # -------------------------------------------------------------------------
    # Request size limits (FR-L7-08)
    # -------------------------------------------------------------------------
    client_max_body_size 10m;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # -------------------------------------------------------------------------
    # Timeouts — Slowloris defense (FR-L7-02)
    # -------------------------------------------------------------------------
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # -------------------------------------------------------------------------
    # Connection limits (FR-L7-07)
    # -------------------------------------------------------------------------
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;
    limit_req_zone  $binary_remote_addr zone=req_per_ip:10m rate=100r/s;

    # -------------------------------------------------------------------------
    # Shared Lua state
    # -------------------------------------------------------------------------
    lua_shared_dict jzap_ratelimit 32m;
    lua_shared_dict jzap_botscores 16m;
    lua_shared_dict jzap_blocklist 16m;
    lua_shared_dict jzap_config    4m;
    lua_shared_dict jzap_metrics   8m;
    lua_shared_dict jzap_challenges 8m;

    lua_package_path "/usr/local/openresty/nginx/lua/?.lua;;";

    init_by_lua_file /usr/local/openresty/nginx/lua/init.lua;

    # -------------------------------------------------------------------------
    # Upstream — origin application server
    # -------------------------------------------------------------------------
    upstream origin {
        server ${PROXY_UPSTREAM_HOST}:${PROXY_UPSTREAM_PORT};
        keepalive 64;
    }

    # -------------------------------------------------------------------------
    # Include server blocks
    # -------------------------------------------------------------------------
    include conf.d/*.conf;
}
