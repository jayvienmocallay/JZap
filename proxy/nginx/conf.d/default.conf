# =============================================================================
# JZap — Default Server Block
# =============================================================================

# Health check endpoint (internal)
server {
    listen 80;
    server_name _;

    # Health check — used by Docker healthcheck and load balancers
    location /health {
        access_log off;
        return 200 '{"status":"ok","service":"jzap-proxy"}';
        add_header Content-Type application/json;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server block
server {
    listen 443 ssl http2;
    server_name _;

    # -------------------------------------------------------------------------
    # TLS configuration
    # -------------------------------------------------------------------------
    ssl_certificate     /certs/proxy/proxy.pem;
    ssl_certificate_key /certs/proxy/proxy-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (Security Requirement 7.1)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # -------------------------------------------------------------------------
    # Connection limits (FR-L7-07)
    # -------------------------------------------------------------------------
    limit_conn conn_per_ip 100;
    limit_req  zone=req_per_ip burst=200 nodelay;

    # -------------------------------------------------------------------------
    # L7 Access Phase — Rate limiting, header inspection, bot scoring
    # -------------------------------------------------------------------------
    access_by_lua_file /usr/local/openresty/nginx/lua/access.lua;

    # -------------------------------------------------------------------------
    # Challenge page (served for suspected bots)
    # -------------------------------------------------------------------------
    location /jzap/challenge {
        internal;
        root /usr/local/openresty/nginx/html;
        try_files /challenge/challenge.html =404;
    }

    # -------------------------------------------------------------------------
    # Proxy pass to origin
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # JZap headers — mark clean traffic
        proxy_set_header X-JZap-Verified "true";
        proxy_set_header X-JZap-Bot-Score $jzap_bot_score;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # -------------------------------------------------------------------------
    # Logging phase
    # -------------------------------------------------------------------------
    log_by_lua_file /usr/local/openresty/nginx/lua/log.lua;
}

# Prometheus metrics endpoint (internal)
server {
    listen 8443;
    server_name _;

    location /metrics {
        content_by_lua_block {
            local metrics = require("metrics")
            metrics.serve()
        }
    }

    location /health {
        access_log off;
        return 200 '{"status":"ok"}';
        add_header Content-Type application/json;
    }
}
