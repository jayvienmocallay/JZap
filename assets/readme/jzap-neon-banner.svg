<svg width="1600" height="420" viewBox="0 0 1600 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="0.5" stop-color="#0a1022"/>
      <stop offset="1" stop-color="#060a18"/>
    </linearGradient>
    <linearGradient id="glow" x1="220" y1="140" x2="1380" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31f4ff"/>
      <stop offset="0.45" stop-color="#8ba8ff"/>
      <stop offset="1" stop-color="#6c87ff"/>
    </linearGradient>
    <linearGradient id="bolt" x1="760" y1="72" x2="830" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6fdff"/>
      <stop offset="0.55" stop-color="#98f9ff"/>
      <stop offset="1" stop-color="#43d8ff"/>
    </linearGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="hard-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.2" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="420" fill="url(#bg)"/>

  <g opacity="0.35" stroke="url(#glow)" stroke-width="1.5">
    <path d="M0 130 C240 90, 390 180, 610 140 C880 90, 1110 190, 1600 120"/>
    <path d="M0 308 C260 250, 460 360, 730 310 C1030 255, 1220 350, 1600 290"/>
  </g>

  <g filter="url(#soft-glow)">
    <text x="800" y="250" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="188" font-weight="800" letter-spacing="18" fill="#afbbff" opacity="0.22">JZAP</text>
  </g>

  <g filter="url(#hard-glow)">
    <text x="800" y="246" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="184" font-weight="900" letter-spacing="16" fill="url(#glow)">JZAP</text>
  </g>

  <g fill="url(#bolt)" filter="url(#hard-glow)">
    <path d="M803 68 L744 192 L793 192 L763 286 L861 160 L810 160 L858 68 Z"/>
    <path d="M383 110 L356 167 L378 167 L360 213 L408 154 L384 154 L406 110 Z" opacity="0.8"/>
    <path d="M1230 236 L1208 279 L1227 279 L1213 317 L1250 272 L1231 272 L1246 236 Z" opacity="0.7"/>
  </g>

  <g stroke="#9ff7ff" stroke-width="2.2" opacity="0.52" filter="url(#soft-glow)">
    <path d="M88 76 L142 96 L178 68 L235 90 L276 72"/>
    <path d="M1334 336 L1382 352 L1424 334 L1480 355 L1528 336"/>
  </g>

  <text x="800" y="330" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="30" letter-spacing="5" fill="#9ec6ff" opacity="0.92">HYBRID DDOS DEFENSE PLATFORM</text>
</svg>
