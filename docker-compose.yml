# =============================================================================
# JZap (ShieldProxy) — Docker Compose Stack
# Core DDoS protection platform
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # Proxy Node — OpenResty + Rust sidecar
  # ---------------------------------------------------------------------------
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    container_name: jzap-proxy
    restart: unless-stopped
    ports:
      - "${PROXY_HTTP_PORT:-80}:80"
      - "${PROXY_LISTEN_PORT:-443}:443"
      - "8443:8443"  # Prometheus metrics endpoint
    volumes:
      - ./proxy/nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
      - ./proxy/nginx/conf.d:/usr/local/openresty/nginx/conf/conf.d:ro
      - ./proxy/nginx/lua:/usr/local/openresty/nginx/lua:ro
      - ./bot-engine/challenge:/usr/local/openresty/nginx/html/challenge:ro
      - proxy-certs:/certs:ro
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - PROXY_UPSTREAM_HOST=${PROXY_UPSTREAM_HOST:-127.0.0.1}
      - PROXY_UPSTREAM_PORT=${PROXY_UPSTREAM_PORT:-8080}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jzap-internal
      - jzap-frontend
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Rust Sidecar — eBPF loader + fingerprint engine + rate limit engine
  # ---------------------------------------------------------------------------
  rust-sidecar:
    build:
      context: ./proxy
      dockerfile: Dockerfile.rust
    container_name: jzap-rust-sidecar
    restart: unless-stopped
    volumes:
      - rust-sidecar-sock:/var/run/jzap
      - proxy-certs:/certs:ro
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - CONTROL_PLANE_URL=https://control-plane:${CONTROL_PLANE_PORT:-8000}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jzap-internal
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
      - BPF
    privileged: true

  # ---------------------------------------------------------------------------
  # Control Plane — FastAPI REST API
  # ---------------------------------------------------------------------------
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: jzap-control-plane
    restart: unless-stopped
    ports:
      - "${CONTROL_PLANE_PORT:-8000}:8000"
    volumes:
      - cp-certs:/certs:ro
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST:-timescaledb}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-jzap}
      - POSTGRES_USER=${POSTGRES_USER:-jzap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - SECRET_KEY=${CONTROL_PLANE_SECRET_KEY:-devkey-change-in-production}
      - API_KEY_SALT=${CONTROL_PLANE_API_KEY_SALT:-devsalt-change-in-production}
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jzap-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Host Agent — Go daemon (for development/testing; production runs on host)
  # ---------------------------------------------------------------------------
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: jzap-agent
    restart: unless-stopped
    volumes:
      - agent-certs:/certs:ro
    environment:
      - CONTROL_PLANE_URL=https://control-plane:${CONTROL_PLANE_PORT:-8000}
      - SYNC_INTERVAL=${AGENT_SYNC_INTERVAL_SECONDS:-30}
      - TELEMETRY_INTERVAL=${AGENT_TELEMETRY_INTERVAL_SECONDS:-10}
    depends_on:
      control-plane:
        condition: service_healthy
    networks:
      - jzap-internal
    cap_add:
      - NET_ADMIN
    healthcheck:
      test: ["CMD", "/app/agent", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # DNS Module — CoreDNS with JZap plugin
  # ---------------------------------------------------------------------------
  dns-module:
    build:
      context: ./dns-module
      dockerfile: Dockerfile
    container_name: jzap-dns
    restart: unless-stopped
    ports:
      - "${DNS_LISTEN_PORT:-5353}:53/udp"
      - "${DNS_LISTEN_PORT:-5353}:53/tcp"
    volumes:
      - dns-certs:/certs:ro
    environment:
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - RRL_RESPONSES_PER_SECOND=${DNS_RRL_RESPONSES_PER_SECOND:-5}
      - RRL_WINDOW_SECONDS=${DNS_RRL_WINDOW_SECONDS:-1}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jzap-internal
      - jzap-frontend
    healthcheck:
      test: ["CMD", "dig", "@localhost", "health.check", "+short", "+time=2"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # TimescaleDB — PostgreSQL with time-series extension
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: jzap-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/002-seed.sql:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-jzap}
      - POSTGRES_USER=${POSTGRES_USER:-jzap}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    networks:
      - jzap-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jzap} -d ${POSTGRES_DB:-jzap}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Rate limit state + pub/sub for rule propagation
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jzap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - jzap-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Prometheus — Metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: jzap-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - jzap-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ---------------------------------------------------------------------------
  # Grafana — Visualization & dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: jzap-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - jzap-internal
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

# =============================================================================
# Volumes
# =============================================================================
volumes:
  pgdata:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  proxy-certs:
    driver: local
  cp-certs:
    driver: local
  agent-certs:
    driver: local
  dns-certs:
    driver: local
  rust-sidecar-sock:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  jzap-internal:
    driver: bridge
    internal: true
  jzap-frontend:
    driver: bridge
